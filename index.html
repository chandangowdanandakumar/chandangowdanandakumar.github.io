<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chandan Gowda Nandakumar</title>
    <script>
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').reduce(function(q, range) {
            var parts = range.split('=');
            if (parts[0] === 'p') q.pathname = '/' + parts.slice(1).join('=').replace(/~and~/g, '&');
            if (parts[0] === 'q') q.search = '?' + parts.slice(1).join('=').replace(/~and~/g, '&');
            return q;
          }, { pathname: '', search: '' });
          window.history.replaceState(null, null, decoded.pathname + decoded.search + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
